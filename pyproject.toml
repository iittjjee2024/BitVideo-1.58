[build-system]
requires = ["setuptools>=68", "wheel", "torch>=2.4"]
build-backend = "setuptools.build_meta"

[project]
name = "bitvideo"
version = "1.58.0"
description = "BitVideo-1.58: a ternary (W1.58A8) Video Diffusion Transformer with fused CUDA kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "BitVideo Authors" }]
keywords = [
    "bitnet",
    "ternary",
    "quantization",
    "video-diffusion",
    "diffusion-transformer",
    "cuda",
    "triton",
    "inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "safetensors>=0.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4.9", "av>=11.0"]
triton = ["triton>=3.0; platform_system=='Linux'"]
flash = ["flash-attn>=2.5; platform_system=='Linux'"]
train = ["tensorboard>=2.15", "wandb>=0.16", "omegaconf>=2.3", "lpips>=0.1.4"]
hf = ["diffusers>=0.30", "transformers>=4.44", "accelerate>=0.33"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6", "einops>=0.8"]
all = [
    "imageio>=2.31", "imageio-ffmpeg>=0.4.9", "av>=11.0",
    "tensorboard>=2.15", "wandb>=0.16", "omegaconf>=2.3",
    "diffusers>=0.30", "transformers>=4.44", "accelerate>=0.33",
    "pytest>=8.0", "ruff>=0.6", "einops>=0.8",
]

[project.urls]
Homepage = "https://github.com/bitvideo/bitvideo-1.58"
Documentation = "https://github.com/bitvideo/bitvideo-1.58/tree/main/docs"

[project.scripts]
bitvideo-bench = "bitvideo.scripts_entry:bench_main"
bitvideo-pack = "bitvideo.scripts_entry:pack_main"

[tool.setuptools]
# Extension modules are declared imperatively in setup.py because they are
# optional (they require a working nvcc) and architecture dependent.
zip-safe = false

[tool.setuptools.packages.find]
include = ["bitvideo*"]
exclude = ["tests*", "benchmarks*", "build*"]

[tool.setuptools.package-data]
bitvideo = [
    "configs/*.yaml",
    "configs/*.json",
    "cuda/*.cu",
    "cuda/*.cpp",
    "cuda/*.h",
    "cuda/*.cuh",
    "cuda/CMakeLists.txt",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --durations=10"
markers = [
    "cuda: requires an available CUDA device",
    "extension: requires the compiled bitvideo._C extension",
    "triton: requires the triton compiler",
    "slow: long running test",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108", "C408"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
